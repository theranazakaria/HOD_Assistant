<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIT HOD Office Desk | GCT Kamalia</title>
<meta name="description" content="Staff task, leave and records system for the Computer Information Technology department, Government College of Technology, Kamalia.">
<meta name="robots" content="noindex">
<style>
:root{--ink:#12304a;--bg:#f4f7f9;--card:#fff;--line:#d3dde4;--mute:#5a6b79;--teal:#0d7a6b;--tx:#fff;--red:#b3261e;--amb:#b26a00;--soft:#e6f1ef;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#e6eef5;--bg:#0e1a24;--card:#152634;--line:#2a4358;--mute:#9db0bf;--teal:#3cc0ac;--tx:#0e1a24;--red:#ff8a80;--amb:#f0b44c;--soft:#173229;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{margin:0 0 .6rem;line-height:1.2}h2{font-size:1.15rem}
.wrap{max-width:1100px;margin:0 auto;padding:0 1rem 3rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 0 .4rem}
.top h1{font-size:1.4rem;margin:0}.sub{color:var(--mute);font-size:.9rem}
nav{display:flex;gap:.3rem;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:.5rem 0 1rem}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:.6rem .8rem;font:600 .93rem inherit;font-family:inherit;color:var(--mute);cursor:pointer}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--teal)}
:focus-visible{outline:3px solid #f0b44c;outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.7rem}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.2rem}
input,select,textarea{width:100%;padding:.55rem .6rem;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:4rem}
.btn{background:var(--teal);color:var(--tx);border:0;border-radius:7px;padding:.55rem .95rem;font:600 .92rem inherit;font-family:inherit;cursor:pointer}
.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}.btn.s{padding:.28rem .6rem;font-size:.82rem}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.7rem;margin-bottom:1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.8rem}.stat b{font-size:1.6rem;display:block}.stat span{color:var(--mute);font-size:.85rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.8rem;color:var(--mute)}
.tag{display:inline-block;padding:.05rem .55rem;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--soft)}
.od{color:var(--red);font-weight:600}.hi{color:var(--amb);font-weight:600}.note{color:var(--mute);font-size:.88rem}.empty{color:var(--mute)}
.chip{display:inline-block;background:var(--soft);border-radius:8px;padding:.3rem .55rem;margin:.15rem .3rem .15rem 0;font-size:.88rem;vertical-align:top}.chk label{display:inline-flex;align-items:center;gap:.3rem;font-weight:500;margin:0 .8rem .3rem 0}.chk input{width:auto}
.err{color:var(--red);margin:.5rem 0}
.login{max-width:22rem;margin:12vh auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9;padding:1rem}.ov img{max-width:100%;max-height:90vh;border-radius:8px}
.tk{border:1px solid var(--line);border-radius:8px;padding:.8rem;margin-bottom:.7rem}

.hero{background:linear-gradient(135deg,#0d7a6b,#12304a);color:#fff;border-radius:14px;padding:1.2rem 1.4rem;margin:.4rem 0 1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.hero h2{font-size:1.4rem;margin:0}.hero p{margin:.2rem 0 0;opacity:.85;font-size:.92rem}
.hero .pill{background:rgba(255,255,255,.16);border-radius:99px;padding:.3rem .8rem;font-size:.85rem;font-weight:600}
.card{box-shadow:0 1px 3px rgba(18,48,74,.08)}
.stat{border-left:4px solid var(--c,#0d7a6b)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:1rem}
@media(max-width:760px){.g2{grid-template-columns:1fr}}
.dn{display:flex;flex-direction:column;align-items:center;gap:.6rem}
.dn .c{position:relative;width:170px;height:170px}.dn .c b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.9rem}.dn .c span{font-size:.75rem;color:var(--mute);font-weight:400}
.lg{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.82rem;color:var(--mute)}.lg i{display:inline-block;width:.7rem;height:.7rem;border-radius:3px;margin-right:.3rem;vertical-align:-1px}
.br{display:grid;grid-template-columns:8rem 1fr 3rem;align-items:center;gap:.6rem;margin:.55rem 0;font-size:.9rem}
.br .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br .bp{text-align:right;font-weight:600}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line)}.bar span{display:block;height:100%}
.me{font-weight:700;color:var(--teal)}
@media(max-width:520px){.br{grid-template-columns:5.5rem 1fr 2.6rem}}
#pa{display:none}
@media print{body>.wrap,.ov{display:none!important}#pa{display:block;padding:1rem;color:#000;background:#fff}#pa table{font-size:11px}#pa th,#pa td{border:1px solid #999}}
</style></head><body>
<div class="wrap" id="app"></div><div id="pa"></div>
<script>
(function(){
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],ST=["Pending","In progress","Done"];
var me=null,tab="",ed=null,ttf=null,TU=[],TT=[],AU=[],P=[],U=[],T=[],A=[],L=[],M=[],pend={},msg="",rep="tasks",$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function today(){var d=new Date(),m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function fmt(s){if(!s)return"";var d=new Date(s+"T00:00:00");return DAYS[d.getDay()]+" "+d.getDate()+" "+d.toLocaleString("en",{month:"short"})+" "+d.getFullYear()}
function ndays(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5)+1}
function adm(){return me&&me.role!=="staff"}
function stf(){return U.filter(function(u){return u.role==="staff"&&u.active})}
function onLeave(id,d){return L.some(function(l){return l.user_id===id&&l.status==="Approved"&&l.from_d<=d&&d<=l.to_d})}
function avail(u,d){if(!d)return true;var w=new Date(d+"T00:00:00").getDay();return String(u.days).split(",").indexOf(String(w))>=0&&!onLeave(u.id,d)}
function api(a,d){var o=Object.assign({a:a},d||{});return fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)}).then(function(r){return r.json().catch(function(){return{e:"Server error."}}).then(function(j){if(!r.ok){if(r.status===401&&a!=="login"&&a!=="me"){me=null;draw()}throw new Error(j.e||"Error")}return j})})}
function load(){var p=[api("tasks.list"),api("leave.list"),api("progress"),api("tutors.list"),api("tt.list")];if(adm())p.push(api("users.list"),api("mis.list"),api("audit.list"));return Promise.all(p).then(function(r){T=r[0].tasks;A=r[0].as;L=r[1].leaves;P=r[2].rows;TU=r[3].tutors;TT=r[4].tt;if(adm()){U=r[5].users;M=r[6].mis;AU=r[7].audit}})}
function act(p,ok){msg="";return p.then(function(){return load()}).then(function(){if(ok)ok();draw()}).catch(function(e){msg=e.message;draw()})}
function tabs(){return adm()?[["dash","Dashboard"],["tasks","Tasks"],["people","Staff & accounts"],["tut","Tutors"],["tt","Timetable"],["leave","Leave"],["mis","Misconduct"],["rep","Reports"],["act","Activity log"]]:[["team","Dashboard"],["mine","My tasks"],["tt","Timetable & tutor"],["leave","My leave"],["prof","Profile"]]}

function draw(){
var a=$("app");
if(!me){a.innerHTML='<div class="card login"><h1>CIT Office Desk</h1><p class="sub">Government College of Technology, Kamalia</p><label for="lu">Username</label><input id="lu" autocomplete="username"><label for="lp" style="margin-top:.6rem">Password</label><input id="lp" type="password" autocomplete="current-password"><div class="err" id="le">'+esc(msg)+'</div><button class="btn" data-a="login">Sign in</button></div>';return}
if(!tab||!tabs().some(function(t){return t[0]===tab}))tab=tabs()[0][0];
var h='<div class="top"><div><h1>CIT Office Desk</h1><div class="sub">'+esc(me.name)+' · '+({staff:"Staff",admin:"Admin (HOD)",superadmin:"Super admin"})[me.role]+'</div></div><button class="btn g s" data-a="logout">Sign out</button></div><nav>'+tabs().map(function(t){return'<button data-a="tab" data-v="'+t[0]+'"'+(t[0]===tab?' aria-current="page"':'')+'>'+t[1]+'</button>'}).join("")+'</nav>';
if(msg)h+='<div class="err" role="alert">'+esc(msg)+'</div>';
h+=({dash:vDash,team:vTeam,tasks:vTasks,people:vPeople,tut:vTut,tt:vTT,act:vAct,prof:vProf,leave:vLeave,mis:vMis,rep:vRep,mine:vMine})[tab]();
a.innerHTML=h;if(tab==="tasks")boxes()}

var COL={d:"#0d7a6b",o:"#3b82f6",l:"#dc2626"};
function sum(rows){var d=0,l=0,t=0;rows.forEach(function(r){d+=r.done;l+=r.late;t+=r.total});return{d:d,l:l,o:t-d-l,t:t}}
function pct(s){return s.t?Math.round(s.d/s.t*100):0}
function donut(s){var tot=s.t||1,off=25,g='<svg viewBox="0 0 42 42" width="170" height="170" role="img" aria-label="Completion chart"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="5"/>';[[s.d,COL.d],[s.o,COL.o],[s.l,COL.l]].forEach(function(x){if(!x[0])return;var n=x[0]/tot*100;g+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+x[1]+'" stroke-width="5" stroke-dasharray="'+n+' '+(100-n)+'" stroke-dashoffset="'+off+'"/>';off-=n});return'<div class="dn"><div class="c">'+g+'</svg><b>'+pct(s)+'%<span>completed</span></b></div>'+legend(s)+'</div>'}
function legend(s){return'<div class="lg"><span><i style="background:'+COL.d+'"></i>Done '+s.d+'</span><span><i style="background:'+COL.o+'"></i>Open '+s.o+'</span><span><i style="background:'+COL.l+'"></i>Overdue '+s.l+'</span></div>'}
function bars(rows){if(!rows.length)return'<p class="empty">No staff yet.</p>';return rows.map(function(r){var o=r.total-r.done-r.late,w=function(n){return r.total?n/r.total*100:0},p=r.total?Math.round(r.done/r.total*100):0;return'<div class="br"><span class="bn'+(me&&r.id===me.id?" me":"")+'" title="'+esc(r.name)+'">'+esc(r.name)+'</span><div class="bar" role="img" aria-label="'+esc(r.name)+': '+r.done+' of '+r.total+' done">'+(r.total?'<span style="width:'+w(r.done)+'%;background:'+COL.d+'"></span><span style="width:'+w(o)+'%;background:'+COL.o+'"></span><span style="width:'+w(r.late)+'%;background:'+COL.l+'"></span>':'')+'</div><span class="bp">'+(r.total?p+"%":"-")+'</span></div>'}).join("")}
function soon(list){var td=today(),e=new Date();e.setDate(e.getDate()+7);var lim=e.getFullYear()+"-"+("0"+(e.getMonth()+1)).slice(-2)+"-"+("0"+e.getDate()).slice(-2);var r=list.filter(function(x){var t=tk(x.task_id);return x.status!=="Done"&&t&&t.due<=lim}).sort(function(a,b){return tk(a.task_id).due<tk(b.task_id).due?-1:1});return r.length?'<div class="tw"><table><tr><th>Task</th>'+(adm()?'<th>Staff</th>':'')+'<th>Deadline</th></tr>'+r.slice(0,8).map(function(x){var t=tk(x.task_id);return'<tr><td>'+esc(t.title)+'</td>'+(adm()?'<td>'+esc(x.name)+'</td>':'')+'<td class="'+(t.due<td?"od":"")+'">'+fmt(t.due)+(t.due<td?" (overdue)":"")+'</td></tr>'}).join("")+'</table></div>':'<p class="empty">Nothing due in the next 7 days.</p>'}
function hero(t,s){return'<div class="hero"><div><h2>'+t+'</h2><p>CIT Department · Government College of Technology, Kamalia</p></div><span class="pill">'+fmt(today())+'</span></div>'}
function vDash(){var td=today(),s=sum(P),ol=stf().filter(function(x){return onLeave(x.id,td)}),pl=L.filter(function(l){return l.status==="Pending"});
var h=hero("Department dashboard")+'<div class="stats">'+[[stf().length,"Active staff","#0d7a6b"],[s.o+s.l,"Open assignments","#3b82f6"],[s.l,"Overdue","#dc2626"],[ol.length,"On leave today","#b26a00"],[pl.length,"Leave requests waiting","#7c3aed"],[M.length,"Misconduct reports","#64748b"]].map(function(x){return'<div class="stat" style="--c:'+x[2]+'"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join("")+'</div>';
h+='<div class="g2"><div class="card"><h2>Overall completion</h2>'+donut(s)+'</div><div class="card"><h2>Progress of every staff member</h2>'+bars(P)+legend(s)+'</div></div>';
h+='<div class="g2"><div class="card"><h2>On leave today</h2><p>'+(ol.length?ol.map(function(x){return esc(x.name)}).join(", "):'<span class="empty">Everyone is in.</span>')+'</p></div><div class="card"><h2>Deadlines in the next 7 days</h2>'+soon(A)+'</div></div>';return h}
function vTeam(){var td=today(),m=P.filter(function(r){return r.id===me.id})[0]||{done:0,late:0,total:0},s=sum([m]),a=sum(P);
return hero("Welcome, "+esc(me.name))+'<div class="g2"><div class="card"><h2>My progress</h2>'+donut(s)+'</div><div class="card"><h2>Team progress</h2><p class="note">Completed share of assigned tasks for each colleague.</p>'+bars(P)+legend(a)+'</div></div><div class="card"><h2>My deadlines in the next 7 days</h2>'+soon(A)+'</div>'}
function tk(id){return T.filter(function(t){return t.id===id})[0]}

function vTasks(){
var h='<div class="card"><h2>Assign a task</h2><div class="row"><div><label for="tt">Title</label><input id="tt"></div><div><label for="ty">Duty type</label><select id="ty">'+["Lesson plan submission","Practical completion","Monthly report","Test report","Syllabus review","Student activity","Other duty"].map(function(x){return'<option>'+x+'</option>'}).join("")+'</select></div><div><label for="td">Deadline date</label><input id="td" type="date"></div><div><label for="tm">Deadline time</label><input id="tm" type="time" value="14:00"></div><div><label for="tp">Priority</label><select id="tp"><option>High</option><option selected>Medium</option><option>Low</option></select></div><div><label for="ts">Assign to</label><select id="ts"><option value="single">One staff member</option><option value="partial">Selected staff</option><option value="all">Whole department</option></select></div></div><div class="chk" id="tb" style="margin-top:.7rem"></div><div class="acts"><button class="btn" data-a="addtask">Assign task</button></div></div>';
h+='<div class="card"><h2>All tasks</h2>'+(T.length?T.map(function(t){var as=A.filter(function(x){return x.task_id===t.id});return'<div class="tk"><b>'+esc(t.title)+'</b> <span class="tag">'+esc(t.scope==="all"?"Whole department":t.scope==="partial"?"Selected staff":"One staff")+'</span> <span class="'+(t.pri==="High"?"hi":"note")+'">'+esc(t.pri)+'</span><div class="note">'+esc(t.type)+' · Deadline '+fmt(t.due)+' '+esc(t.time)+' · Assigned '+fmtTs(t.created)+'</div><div class="tw"><table>'+as.map(function(x){return'<tr><td>'+esc(x.name)+'</td><td><select data-st="'+x.id+'">'+ST.map(function(s){return'<option'+(s===x.status?" selected":"")+'>'+s+'</option>'}).join("")+'</select></td><td>'+esc(x.note)+'<div class="note">'+tsHtml(x)+'</div></td><td>'+(x.img?'<button class="btn s g" data-a="img" data-v="'+x.id+'">Photo</button> ':'')+'<button class="btn s g" data-a="notes" data-r="task" data-v="'+x.id+'">Notes</button></td></tr>'}).join("")+'</table></div><button class="btn s g" data-a="deltask" data-v="'+t.id+'" style="margin-top:.5rem">Delete task</button></div>'}).join(""):'<p class="empty">No tasks yet.</p>')+'</div>';return h}
function boxes(){var el=$("tb");if(!el)return;var sc=$("ts").value,d=$("td").value;if(sc==="all"){el.innerHTML='<span class="note">This task goes to all '+stf().length+' active staff members.</span>';return}
el.innerHTML=(stf().length?stf().map(function(s){var ok=avail(s,d);return'<label><input type="'+(sc==="single"?"radio":"checkbox")+'" name="sb" value="'+s.id+'"> '+esc(s.name)+(ok?"":' <span class="hi">(not available)</span>')+'</label>'}).join(""):'<span class="note">Add staff under Staff & accounts first.</span>')}

function fmtTs(s){if(!s)return"";var p=String(s).split(" ");return fmt(p[0])+(p[1]?", "+p[1]:"")}
function tsHtml(x){return x&&x.updated?"Updated "+fmtTs(x.updated)+(x.updated_by?" by "+esc(x.updated_by):""):""}
function gv(k,f){return ed&&ed.k===k?esc(ed.r[f]==null?"":ed.r[f]):""}
function vPeople(){var sup=me.role==="superadmin",e=ed&&ed.k==="user"?ed.r:null;
var h='<div class="card"><h2>'+(e?"Edit details: "+esc(e.name):"Add account")+'</h2><div class="row"><div><label for="pn">Full name</label><input id="pn" value="'+gv("user","name")+'"></div>'+(e?'':'<div><label for="pu">Username</label><input id="pu" autocapitalize="none"></div><div><label for="pw">Password</label><input id="pw" type="text" autocomplete="off"></div><div><label for="pr">Role</label><select id="pr"><option value="staff">Staff</option>'+(sup?'<option value="admin">Admin (HOD)</option><option value="superadmin">Super admin</option>':'')+'</select></div>')+'<div><label for="pg">Designation</label><input id="pg" placeholder="e.g. Instructor" value="'+gv("user","designation")+'"></div><div><label for="ps">Subjects taught</label><input id="ps" value="'+gv("user","subjects")+'"></div><div><label for="ph">Phone</label><input id="ph" value="'+gv("user","phone")+'"></div><div><label for="pe">Email</label><input id="pe" type="email" value="'+gv("user","email")+'"></div></div>'+(e?'':'<div class="chk" style="margin-top:.7rem">Available days: '+[1,2,3,4,5,6,0].map(function(d){return'<label><input type="checkbox" class="pd" value="'+d+'"'+(d>0&&d<6?" checked":"")+'>'+DAYS[d]+'</label>'}).join("")+'</div>')+'<div class="acts"><button class="btn" data-a="'+(e?"saveuser":"adduser")+'">'+(e?"Save changes":"Create account")+'</button>'+(e?'<button class="btn g" data-a="cancel">Cancel</button>':'')+'</div></div>';
h+='<div class="card"><h2>Accounts</h2><div class="tw"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Designation / subjects</th><th>Contact</th><th>Available days</th><th>Status</th><th></th></tr>'+U.map(function(u){var can=u.role==="staff"||sup;return'<tr><td>'+esc(u.name)+'<div class="note">'+tsHtml(u)+'</div></td><td>'+esc(u.username)+'</td><td>'+esc(u.role)+'</td><td>'+esc(u.designation)+'<div class="note">'+esc(u.subjects)+'</div></td><td>'+esc(u.phone)+'<div class="note">'+esc(u.email)+'</div></td><td>'+String(u.days).split(",").filter(Boolean).map(function(d){return DAYS[d]}).join(", ")+'</td><td>'+(u.active?"Active":'<span class="od">Disabled</span>')+'</td><td>'+(can?'<button class="btn s" data-a="edu" data-v="'+u.id+'">Edit</button> <button class="btn s g" data-a="toggle" data-v="'+u.id+'">'+(u.active?"Disable":"Enable")+'</button> <button class="btn s g" data-a="reset" data-v="'+u.id+'">Reset password</button> <button class="btn s g" data-a="days" data-v="'+u.id+'">Days</button>':'')+'</td></tr>'}).join("")+'</table></div></div>';return h}

function vTut(){var e=ed&&ed.k==="tut"?ed.r:null;
var h='<div class="card"><h2>'+(e?"Edit tutor assignment":"Assign a class tutor")+'</h2><div class="row"><div><label for="uw">Staff member</label><select id="uw">'+stf().map(function(s){return'<option value="'+s.id+'"'+(e&&e.user_id===s.id?" selected":"")+'>'+esc(s.name)+'</option>'}).join("")+'</select></div><div><label for="uc">Class / group</label><input id="uc" placeholder="e.g. CIT Morning" value="'+gv("tut","class_name")+'"></div><div><label for="uy">Year</label><select id="uy">'+["1st Year","2nd Year","3rd Year"].map(function(y){return'<option'+(e&&e.year===y?" selected":"")+'>'+y+'</option>'}).join("")+'</select></div><div><label for="us">Section or shift</label><input id="us" value="'+gv("tut","section")+'"></div><div><label for="ud">Tutor since</label><input id="ud" type="date" value="'+gv("tut","since")+'"></div></div><p class="note">A tutor is the in-charge of a class. Only the staff you assign here are tutors; everyone else stays a regular teacher.</p><div class="acts"><button class="btn" data-a="savetut">'+(e?"Save changes":"Assign tutor")+'</button>'+(e?'<button class="btn g" data-a="cancel">Cancel</button>':'')+'</div></div>';
h+='<div class="card"><h2>Tutor assignments</h2>'+tutTable(true)+'</div>';return h}
